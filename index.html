<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Private</title>
<style>body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#0f172a;display:grid;place-items:center;min-height:100vh;background:#f8fafc}
form{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px;width:min(360px,90vw)}h1{font-size:20px;margin:0 0 14px}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
label{display:block;margin-top:10px;font-size:14px;color:#475569}#msg{min-height:20px;margin-top:10px;font-size:14px;color:#b91c1c}</style></head>
<body><form id="f"><h1>Private page</h1><input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
<label><input type="checkbox" id="keep" checked> Remember on this device</label><button>Unlock</button><div id="msg"></div></form>
<script>
const STORE = "tracker-key";
async function payload() {
  const b = new Uint8Array(await (await fetch("payload.bin", {cache: "no-store"})).arrayBuffer());
  return {salt: b.slice(0, 16), iv: b.slice(16, 28), ct: b.slice(28)};
}
async function derive(pw, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256"}, base,
                                 {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function show(key, p) {
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: p.iv}, key, p.ct);
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
(async () => {
  const p = await payload();
  const saved = localStorage.getItem(STORE);
  if (saved) {
    try {
      const raw = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
      return await show(await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]), p);
    } catch (err) { localStorage.removeItem(STORE); }
  }
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = "Unlocking…";
    try {
      const key = await derive(document.getElementById("pw").value, p.salt);
      if (document.getElementById("keep").checked) {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        await show(key, p);
        localStorage.setItem(STORE, btoa(String.fromCharCode(...raw)));
      } else {
        await show(key, p);
      }
    } catch (err) { msg.textContent = "Wrong password"; }
  };
})();
</script></body></html>
